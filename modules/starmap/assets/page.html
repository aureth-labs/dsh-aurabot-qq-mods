<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星图 · 选择视图</title>
<style>
  :root{
    --bg:#04060f; --fg:#e8eefc; --dim:#8b97b5; --line:rgba(120,160,230,.20);
    --gold:#ffd98a; --violet:#b9a6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 引擎层：两个 iframe 叠在一起，靠 class 切换 ============ */
  #stage{position:fixed;inset:0}
  #stage iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;
    opacity:0;pointer-events:none;transition:opacity .28s ease;
    background:var(--bg);
  }
  #stage iframe.on{opacity:1;pointer-events:auto}

  /* ============ 切换键（右下角，悬浮） ============ */
  #switch{
    position:fixed;right:18px;bottom:18px;z-index:40;
    display:flex;align-items:center;gap:0;
    padding:3px;border-radius:999px;
    background:rgba(12,18,34,.72);
    border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 6px 28px rgba(0,0,0,.55);
    opacity:.55;transition:opacity .22s ease,transform .22s ease;
    font-size:12.5px;
  }
  #switch:hover{opacity:1}
  #switch button{
    appearance:none;border:0;background:transparent;color:var(--dim);
    padding:7px 15px;border-radius:999px;cursor:pointer;
    font:inherit;font-size:12.5px;letter-spacing:.02em;
    transition:color .18s,background .18s;white-space:nowrap;
  }
  #switch button:hover{color:var(--fg)}
  #switch button.act{
    color:#0a0e18;background:linear-gradient(180deg,var(--gold),#ffc65c);
    font-weight:600;box-shadow:0 2px 10px rgba(255,200,90,.28);
  }

  /* ============ 首次选择界面 ============ */
  #pick{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:34px;padding:32px;
    background:
      radial-gradient(1200px 700px at 50% 42%, rgba(58,42,96,.42), transparent 70%),
      radial-gradient(900px 500px at 20% 80%, rgba(32,52,110,.30), transparent 70%),
      #04060f;
    transition:opacity .38s ease,visibility .38s;
  }
  #pick.gone{opacity:0;visibility:hidden;pointer-events:none}

  #pick h1{
    font-size:21px;font-weight:500;letter-spacing:.30em;text-indent:.30em;
    color:#f2f6ff;
  }
  #pick .lead{color:var(--dim);font-size:13px;letter-spacing:.04em;margin-top:-22px}

  .cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}

  .card{
    width:268px;padding:0;border-radius:18px;cursor:pointer;
    background:rgba(10,16,30,.72);
    border:1px solid var(--line);
    overflow:hidden;text-align:left;
    transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    color:inherit;font:inherit;
  }
  .card:hover{
    transform:translateY(-5px);
    border-color:rgba(255,214,138,.52);
    box-shadow:0 16px 46px rgba(0,0,0,.62),0 0 0 1px rgba(255,214,138,.16);
  }
  .card .art{
    height:132px;position:relative;overflow:hidden;
    background:radial-gradient(420px 240px at 50% 50%,#0c1226,#05070f 75%);
  }
  /* 缩略示意：力导向（散点 + 连线） */
  .art.fd::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(2.2px 2.2px at 22% 34%,#cfe6ff,transparent),
      radial-gradient(2.6px 2.6px at 38% 62%,#ffe6a8,transparent),
      radial-gradient(2px 2px at 55% 28%,#cfe6ff,transparent),
      radial-gradient(2.8px 2.8px at 68% 58%,#d9c6ff,transparent),
      radial-gradient(2px 2px at 78% 36%,#cfe6ff,transparent),
      radial-gradient(2.2px 2.2px at 30% 76%,#d9c6ff,transparent),
      radial-gradient(2.4px 2.4px at 62% 78%,#cfe6ff,transparent),
      radial-gradient(1.8px 1.8px at 48% 44%,#ffe6a8,transparent),
      radial-gradient(1.6px 1.6px at 84% 66%,#cfe6ff,transparent);
  }
  .art.fd::after{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(24deg,transparent 49.6%,rgba(150,190,255,.34) 50%,transparent 50.4%),
      linear-gradient(-38deg,transparent 49.6%,rgba(150,190,255,.26) 50%,transparent 50.4%),
      linear-gradient(76deg,transparent 49.7%,rgba(150,190,255,.20) 50%,transparent 50.3%);
    mask-image:radial-gradient(160px 80px at 50% 52%,#000 40%,transparent 78%);
    -webkit-mask-image:radial-gradient(160px 80px at 50% 52%,#000 40%,transparent 78%);
  }
  /* 缩略示意：银河盘 */
  .art.gx::before{
    content:'';position:absolute;left:50%;top:50%;width:190px;height:74px;
    transform:translate(-50%,-50%) rotate(-8deg);
    border-radius:50%;
    background:
      radial-gradient(closest-side,rgba(255,246,214,.95),rgba(255,214,150,.55) 26%,rgba(226,166,232,.34) 52%,rgba(150,160,255,.16) 74%,transparent 100%);
    filter:blur(.6px);
  }
  .art.gx::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(1.6px 1.6px at 18% 46%,#dfe9ff,transparent),
      radial-gradient(1.6px 1.6px at 30% 38%,#ffe9c4,transparent),
      radial-gradient(1.8px 1.8px at 72% 56%,#dcc9ff,transparent),
      radial-gradient(1.4px 1.4px at 82% 44%,#dfe9ff,transparent),
      radial-gradient(1.6px 1.6px at 44% 62%,#ffdfe9,transparent),
      radial-gradient(1.4px 1.4px at 62% 34%,#dfe9ff,transparent);
    opacity:.85;
  }

  .card .txt{padding:14px 17px 17px}
  .card .nm{font-size:14.5px;font-weight:600;letter-spacing:.02em;color:#f4f8ff}
  .card .ds{margin-top:5px;font-size:12px;line-height:1.65;color:var(--dim)}
  .card .tag{
    display:inline-block;margin-top:10px;padding:2.5px 9px;border-radius:999px;
    font-size:11px;color:#c9d6f5;border:1px solid rgba(140,175,255,.24);
    background:rgba(120,160,255,.07);
  }

  #pick .foot{font-size:11.5px;color:#5d6885;letter-spacing:.05em}

  /* 重置入口：只在「已选择过」时出现 */
  #reset{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:41;
    font-size:11.5px;color:#5d6885;background:none;border:0;cursor:pointer;
    letter-spacing:.05em;opacity:.6;transition:opacity .2s;
  }
  #reset:hover{opacity:1;color:#8b97b5}

  /* ============ 隐私开关提示条 ============ */
  #privacy{
    position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:50;
    display:none;align-items:center;gap:12px;padding:9px 14px 9px 16px;
    border-radius:999px;font-size:12.5px;letter-spacing:.02em;
    background:rgba(28,18,14,.86);border:1px solid rgba(255,180,120,.34);
    color:#ffd9b0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.55);white-space:nowrap;
  }
  #privacy.on{display:flex}
  #privacy b{color:#ffc98f;font-weight:600}
  #privacy button{
    appearance:none;border:0;cursor:pointer;font:inherit;font-size:12px;
    padding:5px 13px;border-radius:999px;font-weight:600;color:#20140c;
    background:linear-gradient(180deg,#ffd08a,#ffb457);
  }
  #privacy button:disabled{opacity:.55;cursor:default}
  #privacy .why{color:#a98f7a;font-size:11.5px}

  @media (max-width:640px){
    .card{width:min(86vw,300px)}
    .cards{gap:16px}
    #pick{gap:24px}
    #switch{right:12px;bottom:12px}
    #switch button{padding:7px 12px;font-size:12px}
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="fMap" title="星图"></iframe>
  <iframe id="fGalaxy" title="银河云图"></iframe>
</div>

<div id="switch" role="group" aria-label="切换视图">
  <button type="button" data-view="map">星图</button>
  <button type="button" data-view="galaxy">云图</button>
</div>

<div id="privacy">
  <span>记忆数据显示<b>已关闭</b></span>
  <span class="why">打开后才能看到星图</span>
  <button type="button" id="btn-enable">打开</button>
</div>

<div id="pick">
  <h1>星 图</h1>
  <div class="lead">同一份记忆，两种看法。选一个开始，之后随时能换。</div>
  <div class="cards">
    <button class="card" type="button" data-view="map">
      <div class="art fd"></div>
      <div class="txt">
        <div class="nm">星图 · 关系图</div>
        <div class="ds">力导向布局。关系强的记忆自然聚在一起，谁连着谁一眼看得出。可自由旋转、缩放。</div>
        <div class="tag">看结构</div>
      </div>
    </button>
    <button class="card" type="button" data-view="galaxy">
      <div class="art gx"></div>
      <div class="txt">
        <div class="nm">云图 · 银河盘</div>
        <div class="ds">旋臂盘面。时间当半径、越旧的越靠外。记忆散落在星云里，点一颗才亮出它的星座。</div>
        <div class="tag">看时间</div>
      </div>
    </button>
  </div>
  <div class="foot">选择会记在这台设备上 · 之后可用右下角切换</div>
</div>

<button id="reset" type="button">重新选择视图</button>

<script>
(() => {
  const KEY = 'starmap.view';
  const fMap = document.getElementById('fMap');
  const fGalaxy = document.getElementById('fGalaxy');
  const pick = document.getElementById('pick');
  const sw = document.getElementById('switch');
  const reset = document.getElementById('reset');

  // 两个引擎各自只加载一次（首次切过去时才建），省流量也省内存
  const loaded = { map: false, galaxy: false };
  const TITLE = { map: '星图 · 关系图', galaxy: '云图 · 银河盘' };

  function ensure(view) {
    if (loaded[view]) return;
    loaded[view] = true;
    (view === 'map' ? fMap : fGalaxy).src = '?v=' + view;
  }

  function apply(view, remember) {
    // 数据没打开就不建引擎：空星图看着像坏了，不如先把开关亮出来
    if (!dataOn) {
      privacy.classList.add('on');
      return;
    }
    const v = view === 'galaxy' ? 'galaxy' : 'map';
    ensure(v);
    fMap.classList.toggle('on', v === 'map');
    fGalaxy.classList.toggle('on', v === 'galaxy');
    for (const b of sw.querySelectorAll('button')) {
      b.classList.toggle('act', b.dataset.view === v);
    }
    document.title = TITLE[v];
    if (remember) {
      try { localStorage.setItem(KEY, v) } catch (e) {}
    }
    // 选过之后，重置入口才有意义
    reset.style.display = 'block';
  }

  // ── 隐私开关：数据接口默认关闭，这里提供一键打开 ──────────────
  const privacy = document.getElementById('privacy');
  const btnEnable = document.getElementById('btn-enable');
  let dataOn = false;   // 数据开关状态；false 时不建引擎，省得白渲染一片空星图

  async function refreshPrivacy() {
    try {
      const r = await fetch('settings', { cache: 'no-store' });
      const s = await r.json();
      // 关着的时候把提示条顶出来；开着就收起来
      dataOn = s.enabled === true;
      privacy.classList.toggle('on', !dataOn);
      return s;
    } catch (e) {
      // 读不到就当关着，宁可多提示一次
      dataOn = false;
      privacy.classList.add('on');
      return { enabled: false };
    }
  }

  btnEnable.addEventListener('click', async () => {
    btnEnable.disabled = true;
    btnEnable.textContent = '打开中…';
    try {
      const r = await fetch('settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled: true, scope: 'owner' }),
      });
      const s = await r.json();
      if (s.ok && s.enabled) {
        dataOn = true;
        privacy.classList.remove('on');
        // 刚打开：按已保存的选择（或默认星图）真正把引擎建起来
        let keep = null;
        try { keep = localStorage.getItem(KEY) } catch (e) {}
        pick.classList.add('gone');
        apply(keep === 'galaxy' ? 'galaxy' : 'map', false);
      } else {
        btnEnable.textContent = '打开失败';
        setTimeout(() => { btnEnable.disabled = false; btnEnable.textContent = '打开' }, 2000);
      }
    } catch (e) {
      btnEnable.textContent = '打开失败';
      setTimeout(() => { btnEnable.disabled = false; btnEnable.textContent = '打开' }, 2000);
    }
  });

  // 首次进入：先问开关，再决定要不要建引擎
  (async () => {
    await refreshPrivacy();

    let saved = null;
    try { saved = localStorage.getItem(KEY) } catch (e) {}

    if (saved === 'map' || saved === 'galaxy') {
      pick.classList.add('gone');
      reset.style.display = 'block';
      apply(saved, false);          // dataOn=false 时这里会退回去显示提示条
      if (!dataOn) pick.classList.remove('gone');
    } else {
      reset.style.display = 'none';
      // 有数据才预加载，关着就等用户先打开
      if (dataOn) ensure('map');
    }
  })();

  // 卡片选择
  for (const card of pick.querySelectorAll('.card')) {
    card.addEventListener('click', () => {
      pick.classList.add('gone');
      apply(card.dataset.view, true);
    });
  }

  // 右下角切换
  for (const b of sw.querySelectorAll('button')) {
    b.addEventListener('click', () => apply(b.dataset.view, true));
  }

  // 重新选择
  reset.addEventListener('click', () => {
    pick.classList.remove('gone');
    reset.style.display = 'none';
  });
})();
</script>
</body>
</html>
