<!DOCTYPE html>
<!-- Aurabot 桌宠 · 对话框（petChat，设计稿 docs/PET-CHAT-DESIGN.md）—— 本文件是模板/生成物：
     由插件「桌宠」模块生成到 <数据目录>/modules-data/pet/app/，随 main.js 一起更新。
     只是一个本地小窗：消息流 + 输入框；发送经 ipcRenderer → main.js → POST /chat（永不发 QQ）。
     回复两条路都会进来：① POST 的响应（main 直接 __chatAppend）② 服务端 chat 事件；
     靠 messageId 去重（两边带同一个 id）。Esc / 失焦收起由 main.js 处理。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; display: flex; flex-direction: column;
    font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; background: rgba(250,250,252,.96);
    border-radius: 10px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
  #bar { padding: 6px 10px; font-size: 11px; color: #98a0aa; user-select: none; flex: none; }
  #msgs { flex: 1; overflow-y: auto; padding: 4px 10px 8px; }
  .m { max-width: 86%; margin: 5px 0; padding: 6px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .user { margin-left: auto; background: #dbe9ff; color: #24405f; border-bottom-right-radius: 3px; }
  .pet  { margin-right: auto; background: #fff; color: #333; border: 1px solid #e8e8ee; border-bottom-left-radius: 3px; }
  .hint { margin: 4px auto; background: transparent; color: #a8b0ba; font-size: 11px; }
  #foot { flex: none; display: flex; gap: 6px; padding: 8px 10px 10px; }
  #inp { flex: 1; border: 1px solid #dde1e8; border-radius: 8px; padding: 7px 10px; font: inherit; outline: none; }
  #inp:focus { border-color: #9db8e8; }
  #send { border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; background: #5b8def; color: #fff; cursor: pointer; }
  #send:active { background: #4a7de0; }
</style>
</head>
<body>
  <div id="bar">对话框 · 只在这里聊，不会发到 QQ（Esc 关闭）</div>
  <div id="msgs"></div>
  <div id="foot">
    <input id="inp" placeholder="说点什么…（回车发送）" autofocus>
    <button id="send">发</button>
  </div>
<script>
const { ipcRenderer } = require('electron')
const msgs = document.getElementById('msgs')
const inp = document.getElementById('inp')
const seen = new Set() // messageId 去重：POST 响应与 chat 事件带同一个 id，只画一次
function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML }
function add(role, text, id) {
  if (id) { if (seen.has(id)) return; seen.add(id) }
  const el = document.createElement('div')
  el.className = 'm ' + (role === 'hint' ? 'hint' : role)
  el.innerHTML = role === 'hint' ? esc(text) : esc(text)
  msgs.appendChild(el)
  msgs.scrollTop = msgs.scrollHeight
}
// main.js 注入入口：历史（开窗时一次）/ 单条回复 / 提示（她在想上一句等）
window.__chatSetHistory = (items) => { msgs.innerHTML = ''; seen.clear(); for (const it of (items || [])) add(it.role, it.text, it.messageId) }
window.__chatAppend = (text, id) => add('pet', text, id)
window.__chatUser = (text, id) => add('user', text, id)
window.__chatHint = (text) => add('hint', text)
// 按住说话转出来的字（「识别后直接发送」关着时用它）：只填进输入框，不自动发，
// 免得把识别错的话直接发出去；聚焦并把光标放到末尾，回车就能发。
window.__chatFill = (text) => {
  inp.value = String(text == null ? '' : text)
  inp.focus()
  try { inp.setSelectionRange(inp.value.length, inp.value.length) } catch {}
}
function send() {
  const text = inp.value.trim()
  if (!text) return
  inp.value = ''
  add('user', text) // 本地先画；服务端同样落历史，重开窗时以历史为准
  ipcRenderer.send('pet:chat:send', text)
}
document.getElementById('send').onclick = send
inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send() } })
inp.focus()
</script>
</body>
</html>
