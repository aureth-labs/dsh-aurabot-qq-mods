<!doctype html>
<!-- Aurabot 桌宠渲染页（模板/生成物）：透明无边框、气泡、拖拽 + 甩抛（physics.js）、webm 动画池。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Microsoft YaHei", sans-serif; user-select: none; }
  /* 舞台：动画 / 静态形象都在这里，整块可拖拽（拖拽不用 -webkit-app-region，那样会吞掉指针事件，
     JS 拖拽才能采到轨迹算甩抛初速，见 physics.js）。

     2026-11-05 改成 dsh-pet 的 16:9 口径（462×260）：
     素材本身就是 640×360（16:9）的整块画布，人物只画在中间一小块，四周留给特效
     （放烟花 592 宽、蝴蝶环绕 511 宽、动物环绕 432 宽 —— 一共 35 段大场面）。
     以前舞台是 240×360 竖版 + 「按人物包围盒裁切放大」，等于把留给特效的画布全裁掉，
     所以那些段一播就被切掉两侧。现在舞台就是素材比例，<video> contain 铺满，
     整块画布永久完整 —— 这是 dsh-pet 永远不会「显示不全」的根本原因（css.ts:18-19）。

     2026-11-05 二次修：光把比例对上还不够。实测有两段（放烟花 anim-070、鲸鱼吐泡泡 anim-106）
     内容**自己就画满了整块 640×360 画布**：
         anim-070 并集 x0=22 y0=0 x1=615 y1=359   ← 上下贴死 0..359
         anim-106 并集 y1=335（还好），但 x1=432
     内容贴死画布边 = contain 缩完也贴死舞台边，于是亚像素舍入（462*9/16=259.875 ≠ 260）
     会把最外一圈吃掉，看起来就是「被切了一条」。
     dsh-pet 的舞台是 462 × 259.875（严格 9/16），视频 inset:0 铺满，没有底距、没有 object-position，
     内容贴边时也正好贴住元素边 —— 它靠的是「元素和内容严丝合缝」。
     我们这边舞台写在 CSS 里是整数 260，且还留了 16px 底距，所以必须**显式留出内边距**：
     视频比舞台小 1.5%，居中放置，让贴边内容永远有余量。 */
  #stage {
    position: absolute; left: 20px; bottom: 16px; width: 462px; height: 260px;
    cursor: grab; touch-action: none;
  }
  #stage.dragging { cursor: grabbing; }
  /* 静态形象（没有任何动画素材时的兜底） */
  #pet {
    position: absolute; right: 24px; bottom: 8px; width: 96px; height: 96px;
    border-radius: 50%; background: rgba(60, 170, 220, .85);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; transition: transform .2s;
    transform-origin: 50% 100%;
  }
  #pet.mood-very-happy { transform: scale(1.12) rotate(-6deg); }
  #pet.mood-happy { transform: scale(1.05); }
  #pet.mood-neutral { transform: none; }
  #pet.mood-low { transform: scale(.94); filter: saturate(.7); }
  #pet.mood-sad { transform: scale(.88) rotate(4deg); filter: saturate(.4) brightness(.9); }
  /* webm 动画层（P1）：素材就绪时盖住静态形象。
     2026-11-05 四次修。前三次的错误都在「以为空间够就不会切」，实测不是：
     有 6 段素材（anim-022/048/068/071/097/105）的内容是**向外无限延伸的粒子/特效**
     （泡泡、雪花、落叶、星星、风筝线），导出原始画布帧能看到它们本来就画到了 640×360 边界外，
     素材制作时就已经超出去了 —— 这类段**任何播放方式都不可能完整**，dsh-pet 播它们一样切。

     但我们能做的、且必须做对的两件事：
       ① video 元素必须严格小于舞台，给四边留安全区（不然边界像素被父级 overflow 吃掉，连
          「本来没超」的段也会被削一条）。之前 width:auto 取到素材固有 640×360，就是这里出的血。
       ② `object-position` 不能写死底部。用 50% 100% 会把内容整体往上推，
          本来顶边贴画布的段（风筝/孔明灯）就更容易被切；居中 50% 50% 对上下对称的特效更公平。
     所以现在：写死像素尺寸 + 四边各留 5px + 居中。 */
  .anim-slot {
    position: absolute; left: 5px; top: 5px;
    width: 452px; height: 250px;
    object-fit: contain; object-position: 50% 50%;
    display: none; opacity: 0; transition: transform .05s ease-out;
    /* 底部原点挪成常态（上游 2026-11-07 的改法）：.hold-squash 与 .squashing 共用同一个原点，
       原来只挂在 .squashing 上，按住微捏时原点在左上角、整只会歪掉。 */
    transform-origin: 50% 100%;
    /* alpha 修正（2026-11-05 跟进 dsh-pet 新版）：见 <body> 里的 #pet-alpha-fix 滤镜。
       WebM 的「透明」区实测 alpha 恒为 1/255（dsh-pet 对 109 个素材逐一验证，我们用的是同一批素材），
       Chromium 按 0.4% 不透明度合成，浅色壁纸上就是一层淡灰矩形，看着像「画面有个边」。
       扣掉一档即精确归零；本体只降一档（≤1/255），肉眼不可见。 */
    filter: url(#pet-alpha-fix);
  }
  .anim-slot.is-front { display: block; opacity: 1; }
  .anim-slot.squashing { transform-origin: 50% 100%; }
  /* 按住微捏（上游 1.0.15 的 hold）：按住的全程人物被轻轻捏扁一点（横鼓 8%、下压 50%），松手即回弹。
     原点与过渡都走 .anim-slot 的常态规则，这里只写形变；落地挤压的 inline transform 优先级更高，
     挤压期间盖过本类，结束清内联后按住仍在会自然接回。 */
  .hold-squash {
    transform: scale(1.08, .5);
    transition: transform .05s ease-out;
  }
  /* 朝向翻转（dsh-pet 的 facing）：朝左时整只镜像。素材本身画的是朝右。
     挂在 #stage 而不是 <video> 上：视频元素的 transform 会被落地挤压的 inline style 覆盖，
     挂两层就会「翻着翻着不翻了」。舞台上只有人物，翻它等价于翻人物。 */
  #stage.face-left { transform: scaleX(-1); }
  /* 气泡：锚在宠物头顶（人物头顶≈舞台上沿，即窗口底往上 16+260=276px），向上生长、**按内容自适应宽度**。
     窗口高随内容伸缩：气泡收起 284，弹出时主进程按气泡实高向上长。

     2026-11-06 重做（主人反馈「对话框能不能优化一下」）。旧版的三个毛病：
       ① 宽度写死 462px（整条舞台宽）—— 一句「掉下来了！」也撑满整行，右边一大片空白，
          气泡看起来像个输入框而不是说话。
       ② `border: 1px solid #bcd9ea` + 蓝色调阴影 —— 冷蓝描边配白底，像 QQ 老式提示框。
       ③ `border-radius: 12px` 圆角偏方，`line-height 1.55` + 12.5px 小字，整块偏"工具"气质。

     现在照 dsh-pet 新版 bubble 的口径（runtime/electron-helper/index.html 的 .pet-bubble）：
       · `width: max-content` + min/max-width —— 短句就窄、长句到上限才折行
       · 无描边，纯白半透 + 柔和投影（真实感靠光影而不是线条）
       · 圆角按字号成比例，跟随人物大小一起缩放（--bs 是气泡字号，见下方 applyBubbleScale）
       · 尾巴从「旋转的小方块」改成纯 CSS 三角，边缘不会有描边接缝
     为什么不能用 max-content 撑满窗口：窗口宽度固定 502，气泡若真超过舞台宽就会被窗口裁掉，
     所以 max-width 卡在舞台宽（462px）以内，留一点余量。 */
  #bubble {
    --bs: 13px;                     /* 气泡字号：随人物大小/面板字号联动，见 applyFont */
    /* 舞台在窗口里的位置（与 #stage 的 bottom:16px + height:260px 一致）：
       舞台底 = 窗口底往上 16px，舞台顶 = 往上 276px。 */
    --stage-bottom: 16px;
    --stage-h: 260px;
    --stage-top: calc(var(--stage-bottom) + var(--stage-h));   /* 276px */
    /* 气泡底边压进舞台的量：照 dsh-pet 的 `100% - pet-size*0.108`（bubble.css）。
       素材画布 640×360 里人物头顶只到 y≈80（22%），舞台顶部那一截是透明留白；
       不压进去，气泡尾巴离她头顶就空着一大截，看着像两块不相干的东西。
       462 × 0.108 ≈ 50px。 */
    --bubble-drop: 50px;
    position: absolute; left: 50%;
    /* 底边 = 舞台顶 − 压入量。这样尾巴刚好点在她头顶上方一点（头顶在舞台顶往下约 58px）。 */
    bottom: calc(var(--stage-top) - var(--bubble-drop));
    width: max-content; min-width: calc(var(--bs) * 5.6); max-width: 452px;
    box-sizing: border-box;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, .94);
    border: none; border-radius: calc(var(--bs) * 1.15);
    padding: calc(var(--bs) * .62) calc(var(--bs) * .86);
    font-size: var(--bs); line-height: 1.62; color: #2b2b2b;
    /* 两层阴影：近处一圈硬边做"纸片感"，远处一层大扩散做悬浮感。dsh-pet 也是这一套。 */
    box-shadow: 0 calc(var(--bs) * .2) calc(var(--bs) * .77) rgba(0, 0, 0, .14),
                0 1px 3px rgba(0, 0, 0, .08);
    display: none; cursor: default; word-break: break-word;
    transform-origin: 50% 100%;
    /* 折行只在内容真超过 max-width 时才发生；break-word 只在整词放不下时断，不拆数字 */
    overflow-wrap: break-word; white-space: normal;
    /* 气泡底边会压进舞台的一小块（见 --bubble-drop），DOM 里 #stage 在它后面，
       不显式抬高层级的话人物会盖住气泡。 */
    z-index: 20;
  }
  #bubble.show { display: block; animation: bubbleIn .16s cubic-bezier(.2, .9, .3, 1.1); }
  @keyframes bubbleIn { from { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.94); } to { opacity: 1; transform: translateX(-50%); } }
  /* ---------- 状态卡（悬停 1 秒弹头顶小卡片）----------
     位置和气泡同一套锚点（舞台顶 − 压入量），但整体更靠上一点、也小一圈：
     它和气泡不会同时出现（主进程在气泡挂着时不弹卡），所以不用担心打架。
     pointer-events:none —— 它纯展示，别让它挡住鼠标（否则悬停判定会自己把自己踢飞）。 */
  #statusCard {
    --bs: 13px;
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + 260px - 50px + 6px);
    min-width: calc(var(--bs) * 9); max-width: 300px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, .95);
    border-radius: calc(var(--bs) * .9);
    padding: calc(var(--bs) * .55) calc(var(--bs) * .75);
    font-size: calc(var(--bs) * .92); line-height: 1.55; color: #2b2b2b;
    box-shadow: 0 calc(var(--bs) * .18) calc(var(--bs) * .7) rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .08);
    display: none; pointer-events: none; z-index: 21; white-space: nowrap;
  }
  #statusCard.show { display: block; animation: scIn .14s ease-out; }
  @keyframes scIn { from { opacity: 0; transform: translateX(-50%) translateY(4px) scale(.96); } to { opacity: 1; transform: translateX(-50%); } }
  body.at-top #statusCard { top: calc(16px + 260px - 50px + 6px); bottom: auto; }
  #statusCard .sc-name { font-weight: 600; margin-bottom: calc(var(--bs) * .15); }
  #statusCard .sc-row { white-space: nowrap; }
  #statusCard .sc-row b { font-weight: 600; }
  #statusCard .sc-bar { letter-spacing: -1px; color: #ff9db0; }
  #statusCard .sc-note { opacity: .62; font-size: calc(var(--bs) * .8); margin-top: calc(var(--bs) * .18); }
  /* 顶部角落模式（body.at-top）：气泡改成往下长、小尾巴朝上。
     出生点在左上/右上时，人贴屏幕上沿，气泡再往上长就会顶出屏幕——见 applyCorner。 */
  body.at-top #stage { top: 8px; bottom: auto; }
  /* 顶部角落：气泡改到人物下方往下长。往上压的方向反过来，所以锚点换成 top。 */
  body.at-top #bubble { top: calc(var(--stage-top) - var(--bubble-drop)); bottom: auto; transform-origin: 50% 0; }
  body.at-top #bubble.show { animation: bubbleInTop .16s cubic-bezier(.2, .9, .3, 1.1); }
  @keyframes bubbleInTop { from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(.94); } to { opacity: 1; transform: translateX(-50%); } }
  /* 尾巴：纯 CSS 三角（不是旋转方块）。
     旋转方块的边框会跟气泡描边拼出接缝，而且圆角一改就露缝；三角形没有这个问题。 */
  #bubble::after {
    content: ''; position: absolute; left: 50%; bottom: calc(var(--bs) * -.72);
    transform: translateX(-50%);
    border: calc(var(--bs) * .62) solid transparent;
    border-top-color: rgba(255, 255, 255, .94);
    border-bottom: none;
  }
  body.at-top #bubble::after {
    bottom: auto; top: calc(var(--bs) * -.62);
    border-top: none; border-bottom: calc(var(--bs) * .62) solid rgba(255, 255, 255, .94);
  }
  #bubble .tag {
    display: inline-block; font-size: calc(var(--bs) * .78); color: #5b93b8;
    margin-bottom: calc(var(--bs) * .18); letter-spacing: .02em; font-weight: 600;
  }
  /* 长文本上限：6 行。窗口高上限 H_MAX_BASE = 226(气泡底边) + 280(气泡上限) + 8，装得下。
     按 21px/1.62 的行高算是 6×34=204px + 小标签 + 内边距 ≈ 250px，还在 280 以内。 */
  #bubbleText { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
  /* 大字气泡（上游 1.0.15，余额播报用）：字号提到 17px、行数放宽到 4 行。 */
  #bubble.big { font-size: 17px; }
  #bubble.big #bubbleText { font-size: 17px; -webkit-line-clamp: 4; }

  /* ---------- 内置玩法「吃白饭」的米饭层（2026-11-05 跟进 dsh-pet 新版 scene.ts） ----------
     我们的窗口只有 502×284（不像 dsh-pet 的页面是整屏），所以这一层是**窗口内**的覆盖层：
     米饭从窗口上沿掉到人物脚边，行程就是那 260px 舞台高。整屏掉落做不到，这是窗口架构的硬限制。
     pointer-events:none 是硬要求 —— 一旦改成 auto，这整块就会吃掉鼠标、挡住身后一切应用。 */
  #bf-layer {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    pointer-events: none; overflow: hidden; z-index: 30;
  }
  #bf-layer .bf-rice {
    position: absolute; transform-origin: 50% 100%;
    will-change: transform, opacity; user-select: none; -webkit-user-drag: none; pointer-events: none;
  }
  #bf-layer .bf-score {
    position: absolute; display: flex; align-items: center; gap: 6px;
    padding: 5px 13px 5px 7px; border-radius: 999px; white-space: nowrap;
    background: linear-gradient(180deg, #fff 0%, #e9f1fa 100%);
    border: 1px solid rgba(23, 64, 107, .16);
    box-shadow: 0 8px 22px rgba(23, 64, 107, .2), inset 0 1px 0 #fff;
    pointer-events: none; transform-origin: 50% 100%;
  }
  #bf-layer .bf-score img { width: 26px; height: 26px; object-fit: contain; display: block; }
  #bf-layer .bf-score img.bowl { width: 32px; height: 22px; }
  #bf-layer .bf-score .num { font-size: 22px; font-weight: 800; color: #17406b; line-height: 1; }
  #bf-layer .bf-score .plus {
    position: absolute; right: -6px; top: -10px; font-size: 13px; font-weight: 800;
    color: #e8825a; text-shadow: 0 1px 0 #fff;
  }
  #bf-toast {
    position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 999px;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: rgba(34, 52, 74, .88); color: #fff; opacity: 0;
    transition: opacity .25s ease; pointer-events: none; white-space: nowrap;
  }
  #bf-toast.show { opacity: 1; }
</style>
</head>
<body>
  <!-- alpha 修正滤镜：见 .anim-slot 的 filter 注释。width/height=0 + aria-hidden 让它不占位、不进无障碍树。 -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;left:0;top:0;pointer-events:none">
    <defs>
      <filter id="pet-alpha-fix">
        <feComponentTransfer>
          <feFuncA type="linear" slope="1" intercept="-0.0039215686" />
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>
  <div id="bubble"><div class="tag" id="bubbleTag">主动来找你</div><div id="bubbleText"></div></div>
  <!-- 状态卡（悬停 1 秒）：学 Astra Pet 的 design/pet-life/03 §3 那张小卡片。
       位置和气泡同源（舞台顶 − 压入量），但更小、更靠边、不吃点击（pointer-events:none）。
       内容由主进程先查 /life 再灌进来（window.__statusCard(data)），渲染页只知道怎么画。 -->
  <div id="statusCard"><div class="sc-name" id="scName"></div><div class="sc-row" id="scSat"></div><div class="sc-row" id="scEne"></div><div class="sc-row" id="scBond"></div><div class="sc-note" id="scNote"></div></div>
  <div id="stage">
    <!-- 静态形象的**兜底**：只有素材表为空 / 全部素材加载失败时才出现（见 stopVideo）。
         正常情况下静止时显示的是「待机动画的末帧」= 鲸鱼娘本人，不是这个 emoji。
         初始先藏起来，免得素材表到达前的几百毫秒里闪一下蓝色圆圈。 -->
    <div id="pet" class="mood-neutral" style="display:none">🐳</div>
    <!-- A/B 双缓冲（从 dsh-pet 的 animation.ts 搬来）：新动画先加载到**隐藏的那只**，
         等 loadeddata 就绪才翻到前台。单只 video 换源会先黑一帧、且重播同段要 currentTime=0
         硬跳回首帧——那正是「每两秒闪一下」的根源。两只轮流用就永远看不到这一步。 -->
    <video id="animA" class="anim-slot" autoplay muted playsinline></video>
    <video id="animB" class="anim-slot" autoplay muted playsinline></video>
    <!-- 内置玩法「吃白饭」的米饭层：米饭 / 空碗 / 分数气泡都挂这里（scene 里的 layer） -->
    <div id="bf-layer"></div>
    <div id="bf-toast"></div>
  </div>
<script src="physics.js"></script>
<script src="baifan.js"></script>
<script>
  const bubble = document.getElementById('bubble')
  const bubbleTag = document.getElementById('bubbleTag')
  const bubbleText = document.getElementById('bubbleText')
  const pet = document.getElementById('pet')
  const stage = document.getElementById('stage')
  // A/B 双缓冲：vidA/vidB 轮流用，只有 .is-front 那只可见。
  // `video` 始终指向**当前前台**那只——其余代码（裁切、挤压、诊断）都只关心前台，不用改。
  const vidA = document.getElementById('animA')
  const vidB = document.getElementById('animB')
  let frontIsA = true
  let video = vidA
  /** 当前后台那只（下一次换源写它）。 */
  const backVideo = () => (frontIsA ? vidB : vidA)
  // 换源代次（dsh-pet 的 swapGen）：每次真正开始换源 +1，loadeddata 回来时比对，
  // 对不上说明已被更新的切换顶掉。光比动画名不够——轮换绕回同一段时名字相同，分不出新旧。
  let playGen = 0
  // 冻结标志（dsh-pet 的 applyFreeze）：冻结时动画链不推进。

  let pendingSwapOnce = null

  let cropDone = true   // 保留这个名字给诊断代码用：不裁了，恒为完成

  const applyCropStyle = (w, h, left, bottom) => {

      el.style.height = h
      el.style.left = left
      el.style.bottom = bottom

      const cv = document.createElement('canvas')

      const ctx = cv.getContext('2d', { willReadFrequently: true })

      const d = ctx.getImageData(0, 0, vw, vh).data
      let x0 = vw, y0 = vh, x1 = -1, y1 = -1
      for (let y = 0; y < vh; y++) {
        for (let x = 0; x < vw; x++) {

          if (d[i + 3] > 8 && d[i] + d[i + 1] + d[i + 2] > 24) {

            if (x > x1) x1 = x
            if (y < y0) y0 = y
            if (y > y1) y1 = y

  function resetStageCrop() {

  for (const el of [vidA, vidB]) {
    el.addEventListener('loadeddata', applyStageCrop)

  let packAnims = {}   // 动画名 → 带 token 的素材地址（主进程给）
  let pools = { idle: [], speak: [], click: [] }
  let weights = {}

  let rollCfg = null
  let lastRoll = null   // 最近一次掷骰结果 { kind, anim, at }（诊断用，见 __rollInfo）
  let labelMap = {}    // 素材 id → 中文原名（调试面板显示用）
  let physicsParams = null
  let workMap = {}     // 干活状态 → 动画 id（服务端按命名约定/包配置解析好）
  let memeUrls = {}    // 梗图名 → 带 token 的图片地址（主进程给，和 anims 同一套）
  let baifanCfg = null // 内置玩法「吃白饭」：{ slots:[5 个素材 id], pics:{bowl-full,bowl-empty,rice-ball 地址} }；null = 这个包没有
  window.__setPack = (p) => {

    if (p && Array.isArray(p.baifan) && p.baifan.length === 5 && p.baifanPics) {

    for (const el of [vidA, vidB]) el.removeAttribute('data-src')

    pendingSwapOnce = null

    weights = (p && p.weights) || {}
    rollCfg = (p && p.roll) || null
    labelMap = (p && p.labels) || {}
    physicsParams = (p && p.physics) || null
    workMap = (p && p.workStatus) || {}

  /** 只翻上沿/下沿布局（主进程改出生点时单独推，避免重推整份素材表导致动画重播=闪烁）。 */
  window.__setCorner = (isTop) => { applyCorner(isTop === true) }
  const hasAnims = () => Object.keys(packAnims).length > 0

  let currentAnim = ''
  let currentKind = ''

  //   ② 说话气泡（speak 池）
  //   ③ 用户点击（click 池）

  let autoIdle = false

  let idleLoopOn = true

  // 注意：0 间隔也不会「闪」——换段走 A/B 双缓冲，新段 loadeddata 就绪才翻前台。

  let coolDown = {}   // 动画名 → 冷却到期时间戳；到期后 pickFrom 自动恢复可选

    const w = pool.map((n) => Math.max(0, Number(weights[poolName]) || 1))
    const total = w.reduce((a, b) => a + b, 0)
    if (!(total > 0)) return pool[Math.floor(Math.random() * pool.length)]
    let r = Math.random() * total

  function pickAvoid(list, current) {

    if (!arr.length) return ''

    const src = rest.length ? rest : arr
    return src[Math.floor(Math.random() * src.length)]
  }

   *  骰子落在哪档再从那一档里抽一段，所以包里那 90 多段平时就会自己演，不只是待机池那几段。

   *    · turn → turn 池随机一段，播完翻朝向（整只左右镜像）
   *    · move → 交给主进程走位（petBridge.walk），途中自动播踏步动画
   *    · 其余 → 抽某个分类（美食/才艺/奇幻/日常/节日）

  function rollSelfAnim() {

    const ok = (n) => Boolean(n) && Boolean(packAnims[n]) && !(coolDown[n] && now < coolDown[n])

    if (!idleList.length && !cats.length && !turnList.length && !canWalk) return { kind: '', anim: '' }
    const w = (rollCfg && rollCfg.weights) || {}
    const idleW = Math.max(0, Number(w.idle) || 0)
    const turnW = turnList.length ? Math.max(0, Number(w.turn) || 0) : 0
    const moveW = canWalk ? Math.max(0, Number(w.move) || 0) : 0
    const catW = cats.reduce((s, c) => s + c.weight, 0)
    // 归一化：老包分类权重和不一定等于 100-idle-turn-move，按比例分，不依赖配置写得多准。
    const total = idleW + turnW + moveW + catW

    let t = Math.random() * total

    t -= idleW
    if (t < turnW) return { kind: 'TURN', anim: pickAvoid(turnList, currentAnim), turn: true }
    t -= turnW

    t -= moveW

    let hit = cats[cats.length - 1]

  /** 走位桥可用吗：preload 有 walk 通道，且现在没在走/没在拖/没冻结。 */

      currentAnim = ''
      currentKind = 'still'
      scheduleIdle()
      return

  /** 待机帧：判断当前这段是不是待机池里的（是就不用换段，原地定格最自然）。 */

  }
  /** 摆静态立绘：播一段待机动画，播完停在末帧（不循环、不接下一段）。

   *  playStill 这一路走完也永远不再动 —— 桌宠启动后一直发呆就是这么来的。

  function playStill() {

    const r = rollSelfAnim()

    playAnim(name, () => {

  /** 播一段动画。onEnd 缺省 = 播完走 afterAnim。

  function playAnim(name, onEnd, kind, loop) {

    if (pendingSwap && pendingSwap.anim === name && pendingSwap.once === pendingSwapOnce) {

    }
    notePlaySwitch(name, kind) // 诊断：统计重播（查闪烁用）

    let worst = null
    for (const r of rows) {
      if (!worst || Math.min(r.slackX, r.slackY) < Math.min(worst.slackX, worst.slackY)) worst = r
    }
    return {
      total: names.length, checked: rows.length,
      // 真实 DOM 几何：video 必须严格包在 stage 里，否则就是被父级裁
      stage: { w: Math.round(STAGE_W), h: Math.round(STAGE_H) },
      video: { w: Math.round(BOX_W), h: Math.round(BOX_H) },
      videoInsideStage: BOX_W <= STAGE_W + 0.5 && BOX_H <= STAGE_H + 0.5,
      overCount: over.length, over: over.slice(0, 20),
      touchCount: touching.length,
      touch: touching.slice(0, 40).map((r) => r.name),
      worst, failedCount: failed.length, failed: failed.slice(0, 20),
    }
  }

  /** 导出某段动画某一帧的**原始画布**（640×360，带 1px 红框标出画布边界）。
   *  用途：判断「内容被切」是素材自己就这样，还是我们裁的。
   *  画布外的东西 canvas 截不到，所以这个图能直接看到「素材里就切了」还是「还有余量」。
   *  @returns {ok, dataUrl, vw, vh, box} */

    const url = packAnims[name]

    const v = document.createElement('video')
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url
    const ready = await new Promise((res) => {
      v.onloadeddata = () => res(true)
      v.onerror = () => res(false)

    })

    const d = Number.isFinite(v.duration) && v.duration > 0 ? v.duration : 0
    if (d > 0) {
      const t = Math.min(Math.max(0, Number(at) || d * 0.5), d - 0.05)

        let done = false

        const i = (y * cv.width + x) * 4
        if (dd[i + 3] > 8 && dd[i] + dd[i + 1] + dd[i + 2] > 24) {
          if (x < x0) x0 = x; if (x > x1) x1 = x
          if (y < y0) y0 = y; if (y > y1) y1 = y
        }
      }
    }

    ctx.lineWidth = 2
    ctx.strokeRect(1, 1, cv.width - 2, cv.height - 2)

    return {
      ok: true, name, vw: cv.width, vh: cv.height,
      box: x1 < 0 ? null : { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 },
      dataUrl: cv.toDataURL('image/png'),
    }
  }

  // ---------- 干活状态（思考/干活/等确认/完成/出错）：跟着 DSH 会话切动画 ----------
  // 进行中的档位循环播同一段（思考就一直在思考），终态播一次就回 idle；状态没变不重播。
  // 动画来源：包的 events.workStatus（或按 default 包的「工作状态-*」命名约定自动识别的 idle 映射）。
  const WORK_ACTIVE = { thinking: 1, working: 1, waiting: 1, result: 1 }
  let workState = ''
  let workLoopTimer = null  // 干活链的看门狗（只防 ended 不来，不是周期性换段）
  let workLoopAt = 0        // 本轮活动档位开始循环的时间（兜底上限用）
  /** 该档位的全部候选动画（可轮换）。
   *  严格照 dsh-pet 的 nextWorkStatusAnim 语义：**只在同一档位内轮换**，
   *  绝不把 idle 池的动画混进来——那些段内容/时长都不对，切过去就是「突然换了个动作」，
   *  看起来像跳帧。档位只有一个候选时就不轮换（续播同一段）。
   *  档位配置支持两种写法：字符串（固定一段）或数组（档内多候选）。 */
  function workCandidates(state) {
    const raw = workMap[state]
    if (Array.isArray(raw)) {
      // 数组槽位 = 档内候选，只保留素材包里真有的
      return raw.filter((n) => typeof n === 'string' && packAnims[n])
    }
    if (typeof raw === 'string' && packAnims[raw]) return [raw]
    return []
  }
  /** 档内下一候选（排除当前，避免连抽自己）。单候选时返回 null = 续播同一段。 */
  function nextWorkCand(cands, current) {
    if (!Array.isArray(cands) || cands.length <= 1) return null
    const rest = cands.filter((n) => n !== current)

    return src[Math.floor(Math.random() * src.length)]
  }
  /** 非终态档位的「播完接着播」（2026-11-05 重写，照 dsh-pet cues.ts 的 work-rotate / work-replay）。
   *  dsh-pet 的口径：
   *    · 单候选 → setOnce(false)，<video> 自己无限循环，**没有任何定时器**；
   *    · 多候选 → setOnce(true)，播完由 ended 判定换到档内下一候选。
   *  以前这里是 setTimeout(1200) 强行换段：素材普遍 3~8 秒，1.2 秒切一刀，

  function workLoopOnce(st, cands, mapped) {

      // **不能**在这里 playIdle——新档位的动画刚起播，会被这一下顶掉（以前就容易这样打一下）。
      if (workState !== st) return

    function playWork(name) {

      const ok = playAnim(name, loop ? null : advance, 'work', loop)
      // 看门狗只防「ended 永远不来」的病态情况（元数据坏 / 解码残留），
      // 用固定大天花板，绝不按段长周期性打断：正常段 3~10 秒，60 秒远够播完。
      if (!loop && ok) {

    // 状态照记，等玩法收场后由主进程重推一次即可。

    workState = st

      stopWorkWatchdog()

      // 动画链拿不到推进信号，宠物会一直卡在工作动画上（cues.ts 的 stopLoopingFront）。
      if (currentKind === 'work') {
        try { video.loop = false } catch {}
        playIdle()
      } else scheduleIdle()
      return true
    }
    const cands = workCandidates(st)
    if (!cands.length) {
      // 档位没配或素材缺失：退落叶 speak 池播一次，不参与轮换
      const fallback = pickFrom('speak')
      if (!fallback) return false
      stopIdleLoop()
      stopWorkWatchdog()
      return playAnim(fallback, null, 'work')
    }
    const active = Boolean(WORK_ACTIVE[st])
    stopIdleLoop() // 进工作档位：空闲轮换让位（否则播完 work 段会被 idle 接力抢走）
    stopWorkWatchdog()

  /** 冻结开关（dsh-pet 的 applyFreeze）：冻结时不推进动画链、不换源，画面定格。

  /** 拖拽松手后恢复工作档位（dsh-pet 的 resumeWorkStatusAnim）。

   *  干活动画断掉、下次 work 事件来才重新接上，看起来像「拖一下就罢工了」。
   *  2026-11-05 与 __setWork 共用 workLoopOnce：不再有 1.2s 定时器换段。 */
  function resumeWorkStatusAnim() {

  // 数据由主进程先查 /life 再灌进来：null = 收起。渲染页只负责画，不自己算数值。
  // 为什么不画在气泡里：气泡是「她说话」，状态卡是「她的身体状况」——两件事，
  // 而且气泡挂 6~30 秒，把数值塞进去会把话挤掉。
  const statusCardEl = document.getElementById('statusCard')
  const scName = document.getElementById('scName')
  const scSat = document.getElementById('scSat')
  const scEne = document.getElementById('scEne')
  const scBond = document.getElementById('scBond')
  const scNote = document.getElementById('scNote')
  /** 一条带进度条的行：饱腹 62 → 6 格实心。满格 10 格，和 Astra Pet 那张卡一致。 */
  const scBar = (v, max = 100, n = 10) => {
    const filled = Math.max(0, Math.min(n, Math.round((Number(v) || 0) / max * n)))
    return '█'.repeat(filled) + '░'.repeat(n - filled)
  }

    if (!statusCardEl) return false
    if (!data) { statusCardEl.classList.remove('show'); return true }
    const sat = Number(data.satiety) || 0
    const ene = Number(data.energy) || 0
    const lv = Number(data.level) || 1
    // 跟气泡一样用软糖体（applyFont 管着 --bs），这里不另设字体，靠继承
    scName.textContent = `${data.petName || '大肥鱼'}　${'♥'.repeat(Math.max(1, Math.min(5, Math.round(lv / 2))))}${'♡'.repeat(Math.max(0, 5 - Math.round(lv / 2)))} Lv.${lv} ${data.levelName || ''}`
    scSat.innerHTML = `🍙 饱腹 <span class="sc-bar">${scBar(sat)}</span> <b>${sat}</b>`
    scEne.innerHTML = `⚡ 精力 <span class="sc-bar">${scBar(ene)}</span> <b>${ene}</b>`
    const snacks = Array.isArray(data.snacks) && data.snacks.length
      ? data.snacks.map((s) => `${s.icon}×${s.n}`).join(' ')
      : ''
    scBond.textContent = `✨ ${data.levelName || ''}　${Math.round(Number(data.xp) || 0)} 经验${data.toNext ? `（还差 ${data.toNext.need}）` : '（满级）'}`
    scNote.textContent = snacks ? `攒着：${snacks}` : (data.days ? `认识 ${data.days} 天了` : '')
    statusCardEl.classList.add('show')
    return true
  }

  // ---------- 拖拽 + 甩抛（2026-11-07 起改「主进程权威」；上游 1.0.15 的 DPI 修正）----------

  // 目标格式固定 16kHz / 单声道 / PCM16 WAV：插件的识别模型只吃这一种。
  // 麦克风原始采样率通常 44.1k/48k，用 OfflineAudioContext 重采样到 16k（浏览器自带，不用第三方库）。
  const HEAR_RATE = 16000
  const HEAR_MAX_MS = 24_000   // 再长就超插件侧 800KB 上限了
  const HEAR_MIN_MS = 300      // 短于它按误碰处理：不送识别、也不吭声
  let hearRec = null           // { stream, ctx, proc, src, chunks, startedAt, timer, done }

  /** 浮点 [-1,1] → PCM16（负半轴按 32768 缩放，免得 -1 溢出成正数）。 */
  function toPcm16(samples) {
    const out = new Int16Array(samples.length)
    for (let i = 0; i < samples.length; i++) {
      const v = samples[i] < -1 ? -1 : samples[i] > 1 ? 1 : samples[i]
      out[i] = v < 0 ? v * 0x8000 : v * 0x7fff

    return out
  }
  /** 拼一个裸 PCM 的 WAV（44 字节头 + 采样）。头里每个字段插件都会用到，不做「挑个能用的模板」那套。 */
  function encodeWav(pcm, rate) {
    const dataBytes = pcm.length * 2
    const bytes = new Uint8Array(44 + dataBytes)
    const view = new DataView(bytes.buffer)
    const ascii = (off, s) => { for (let i = 0; i < s.length; i++) bytes[off + i] = s.charCodeAt(i) }
    ascii(0, 'RIFF'); view.setUint32(4, 36 + dataBytes, true); ascii(8, 'WAVE')
    ascii(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true)
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true)
    ascii(36, 'data'); view.setUint32(40, dataBytes, true)
    for (let i = 0; i < pcm.length; i++) view.setInt16(44 + i * 2, pcm[i], true)
    return bytes
  }
  /** 峰值（0..1）：判静音只关心「有没有声音进来」。 */
  function peakOf(pcm) {
    let peak = 0
    for (let i = 0; i < pcm.length; i++) { const v = pcm[i] < 0 ? -pcm[i] : pcm[i]; if (v > peak) peak = v }
    return peak / 0x8000
  }
  /** 字节 → base64（分段：一次展开几十万字节会撑爆参数栈）。 */
  function toBase64(bytes) {
    let bin = ''
    const CH = 8192
    for (let o = 0; o < bytes.length; o += CH) {
      const end = Math.min(o + CH, bytes.length)
      for (let i = o; i < end; i++) bin += String.fromCharCode(bytes[i])
    }
    return btoa(bin)
  }

  window.__hearStart = async () => {
    if (hearRec) return
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    }
    let stream

      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } })

      window.petBridge && window.petBridge.hearState && window.petBridge.hearState('denied')

    try { ctx = new Ctx() } catch { try { stream.getTracks().forEach((t) => t.stop()) } catch {} ; return }
    const src = ctx.createMediaStreamSource(stream)
    // ScriptProcessor 已废弃但这里够用且零依赖：只收不处理，重采样交给 OfflineAudioContext
    const proc = ctx.createScriptProcessor(4096, 1, 1)
    const chunks = []
    proc.onaudioprocess = (ev) => {
      if (!hearRec) return
      chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)))
    }
    src.connect(proc)

    // 中间串一个 gain=0 的节点，链路通、声音不出。
    const mute = ctx.createGain()
    mute.gain.value = 0
    proc.connect(mute)

    hearRec = { stream, ctx, proc, src, mute, chunks, startedAt: Date.now(), rate: ctx.sampleRate, done: false }

    // 拼成一整段（每块 4096 样本，直接 concat）
    let total = 0
    for (const c of rec.chunks) total += c.length
    if (!total) { send('empty'); return }
    const flat = new Float32Array(total)
    let off = 0
    for (const c of rec.chunks) { flat.set(c, off); off += c.length }

    const outLen = Math.max(1, Math.round(flat.length * HEAR_RATE / rec.rate))

      if (r.width > 0 && r.height > 0) rects.push({ x: r.x, y: r.y, width: r.width, height: r.height })

    const now = Date.now()
    const recent = st.switches.filter((s) => now - s.t < 60000)
    // 同一段动画在短时间内被反复从头播 = 典型闪烁
    const counts = {}
    for (const s of recent) counts[s.name] = (counts[s.name] || 0) + 1
    const repeats = Object.entries(counts).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1])
    return {
      totalSwitches: st.total,
      lastMinute: recent.length,
      repeatPlayed: repeats.slice(0, 5), // [名字, 次数]：>1 就是同段重播

      cropK,

      el: el ? (el.id || el.tagName) : 'null',

      inBubble: !!(el && bubble.contains(el)),

      stageRect: { x: sr.left, y: sr.top, w: sr.width, h: sr.height, right: sr.right, bottom: sr.bottom },
      videoRect: { x: vr.left, y: vr.top, w: vr.width, h: vr.height, right: vr.right, bottom: vr.bottom },

    if (dragging) {

      if (e.buttons === 0) {

  refitWindow()

  // ---------- 内置玩法「吃白饭」实例化（2026-11-05）----------
  // 依赖全部注入，导演（baifan.js）不直接碰播放器/窗口，职责边界清楚：

  if (typeof createBaifan === 'function') {

      config: () => baifanCfg,
      stageRect: () => {

        // null/缺省 = 只要求「挪到工作区底部」。
        // 返回 { ok, movedX, movedY }：玩法要靠 movedX 把世界坐标的道具换算回窗口内。
        const p = window.petBridge && typeof window.petBridge.walk === 'function'
          ? window.petBridge.walk({ dx: Number.isFinite(dx) ? dx : null, ...(opts || {}) })
          : null
        return (p && typeof p.then === 'function')
          ? p.then((r) => ({ ok: Boolean(r && r.ok), movedX: Number(r && r.movedX) || 0, movedY: Number(r && r.movedY) || 0 }))
          : Promise.resolve({ ok: false, movedX: 0, movedY: 0 })
      },
      pose: () => window.__bfPose(),
      face: (left) => window.__bfFace(left),
      clipMs: (name) => window.__bfClipMs(name),
      log: (msg) => { try { window.petBridge && window.petBridge.diag && window.petBridge.diag('baifan', msg) } catch {} },
      isInterrupted: () => Boolean(dragging) || frozen,
    })
  }
  /** 只弹气泡、不切动画：玩法运行中的台词必须走这条，否则 speak 池会被顺带播出来顶掉吃动画。 */
  function sayOnly(text, ms) {
    if (!text) return
    const { text: plain, meme } = splitMeme(text)
    bubbleText.textContent = plain
    bubbleText.style.display = plain ? '' : 'none'
    if (meme) showMeme(meme)
    else hideMeme()
    bubbleTag.textContent = '吃白饭'
    bubble.classList.add('show')
    clearTimeout(bubbleTimer)
    bubbleTimer = setTimeout(hide, Math.max(1200, (ms || 2400)))
    requestAnimationFrame(() => { refitWindow(); syncInputRegions() })
  }
</script>
</body>
</html>
